name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ai-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pydantic python-dotenv psycopg2-binary qdrant-client langchain-google-genai
      - run: python -m pytest ai_engine/tests -q

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app_server/backend/requirements.txt pytest
      - run: python -m pytest app_server/backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app_server/frontend/package-lock.json
      - run: npm ci
      - run: npm run build